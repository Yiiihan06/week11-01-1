<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Head Up Protocol - Boot Screen</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&display=swap');

        body {
            font-family: 'Orbitron', monospace;
            background: #000;
            color: #00aa33;
            overflow: hidden;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #boot-screen {
            width: 100%;
            height: 100%;
            position: relative;
            background: radial-gradient(ellipse at center, #001408 0%, #000000 100%);
            transition: opacity 1s ease-out;
        }

        #boot-screen.fade-out {
            opacity: 0;
        }

        /* Scanlines effect */
        #boot-screen::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 170, 51, 0.03) 0px,
                transparent 1px,
                transparent 2px,
                rgba(0, 170, 51, 0.03) 3px
            );
            pointer-events: none;
            z-index: 1;
        }

        /* Vignette effect */
        #boot-screen::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 200px rgba(0, 0, 0, 0.8);
            pointer-events: none;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 40px;
        }

        .logo {
            font-size: 48px;
            font-weight: 900;
            letter-spacing: 8px;
            margin-bottom: 20px;
            text-shadow: 0 0 20px #00aa33, 0 0 40px #00aa33;
            animation: pulse 2s infinite;
        }

        .subtitle {
            font-size: 14px;
            letter-spacing: 4px;
            opacity: 0.7;
            margin-bottom: 60px;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* Hand scanning area */
        #hand-scanner {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 400px;
            display: none;
            z-index: 10;
        }

        #hand-scanner.active {
            display: block;
        }

        .scanner-frame {
            position: relative;
            width: 100%;
            height: 100%;
            border: 2px solid #00aa33;
            box-shadow: 0 0 30px rgba(0, 170, 51, 0.5), inset 0 0 30px rgba(0, 170, 51, 0.2);
            animation: scannerGlow 1.5s infinite;
        }

        @keyframes scannerGlow {
            0%, 100% { box-shadow: 0 0 30px rgba(0, 170, 51, 0.5), inset 0 0 30px rgba(0, 170, 51, 0.2); }
            50% { box-shadow: 0 0 60px rgba(0, 170, 51, 0.8), inset 0 0 60px rgba(0, 170, 51, 0.4); }
        }

        .scanner-corner {
            position: absolute;
            width: 30px;
            height: 30px;
            border: 3px solid #00aa33;
        }

        .scanner-corner.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .scanner-corner.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .scanner-corner.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .scanner-corner.br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        .scan-line {
            position: absolute;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, #00aa33, transparent);
            box-shadow: 0 0 20px #00aa33;
            animation: scan 2s linear infinite;
        }

        @keyframes scan {
            0% { top: 0; }
            100% { top: 100%; }
        }

        .hand-icon {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 120px;
            opacity: 0;
            animation: handPulse 1s infinite;
        }

        @keyframes handPulse {
            0%, 100% { opacity: 0.3; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        .scan-text {
            position: absolute;
            bottom: -40px;
            width: 100%;
            text-align: center;
            font-size: 14px;
            letter-spacing: 2px;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }

        /* Initialize Button */
        #initialize-btn {
            position: relative;
            width: 400px;
            height: 80px;
            background: transparent;
            border: 3px solid #00aa33;
            color: #00aa33;
            font-family: 'Orbitron', monospace;
            font-size: 28px;
            font-weight: 700;
            letter-spacing: 6px;
            cursor: pointer;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: auto;
            margin-bottom: 100px;
            box-shadow: 0 0 20px rgba(0, 170, 51, 0.3), inset 0 0 20px rgba(0, 170, 51, 0.1);
        }

        #initialize-btn:hover:not(.disabled) {
            box-shadow: 0 0 40px rgba(0, 170, 51, 0.6), inset 0 0 40px rgba(0, 170, 51, 0.2);
            transform: scale(1.05);
        }

        #initialize-btn.disabled {
            cursor: not-allowed;
            opacity: 0.5;
        }

        .btn-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 0;
            height: 100%;
            background: #00aa33;
            transition: width 3s linear;
            z-index: 0;
        }

        .btn-bg.filling {
            width: 100%;
        }

        .btn-text {
            position: relative;
            z-index: 1;
            mix-blend-mode: difference;
        }

        .btn-corners {
            position: absolute;
            width: 20px;
            height: 20px;
            border: 2px solid #00aa33;
        }

        .btn-corners.tl { top: -2px; left: -2px; border-right: none; border-bottom: none; }
        .btn-corners.tr { top: -2px; right: -2px; border-left: none; border-bottom: none; }
        .btn-corners.bl { bottom: -2px; left: -2px; border-right: none; border-top: none; }
        .btn-corners.br { bottom: -2px; right: -2px; border-left: none; border-top: none; }

        /* Loading logs */
        #loading-logs {
            position: absolute;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%);
            width: 600px;
            opacity: 0;
            transition: opacity 0.5s;
        }

        #loading-logs.active {
            opacity: 1;
        }

        .log-entry {
            font-size: 14px;
            letter-spacing: 2px;
            margin: 8px 0;
            opacity: 0;
            animation: logAppear 0.3s forwards;
        }

        @keyframes logAppear {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .log-entry::before {
            content: '> ';
            color: #00aa33;
            font-weight: bold;
        }

        .log-entry .dots {
            animation: dotBlink 1.5s infinite;
        }

        @keyframes dotBlink {
            0%, 100% { opacity: 0; }
            50% { opacity: 1; }
        }

        /* Camera indicator */
        #camera-indicator {
            position: absolute;
            top: 20px;
            right: 20px;
            display: flex;
            align-items: center;
            font-size: 12px;
            letter-spacing: 2px;
            z-index: 5;
        }

        .cam-dot {
            width: 12px;
            height: 12px;
            background: #ff0055;
            border-radius: 50%;
            margin-right: 8px;
            animation: camBlink 2s infinite;
        }

        .cam-dot.active {
            background: #00aa33;
            animation: none;
        }

        @keyframes camBlink {
            0%, 50%, 100% { opacity: 1; }
            25%, 75% { opacity: 0.3; }
        }

        /* Video element (hidden) */
        #video {
            position: absolute;
            top: -9999px;
            left: -9999px;
        }

        /* Status message */
        #status-message {
            position: absolute;
            top: 100px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 16px;
            letter-spacing: 3px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.5s;
            z-index: 5;
        }

        #status-message.active {
            opacity: 1;
        }

        /* Grid background */
        .grid-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(0, 170, 51, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 170, 51, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            opacity: 0.3;
            z-index: 0;
        }

        /* Error alert */
        #error-alert {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 600px;
            padding: 30px 40px;
            background: rgba(255, 0, 0, 0.1);
            border: 3px solid #ff0033;
            border-left: 10px solid #ff0033;
            color: #ff3355;
            font-size: 18px;
            letter-spacing: 3px;
            text-align: center;
            box-shadow: 0 0 40px rgba(255, 0, 51, 0.6), inset 0 0 40px rgba(255, 0, 51, 0.2);
            z-index: 20;
            display: none;
            animation: alertPulse 0.5s ease-out;
        }

        #error-alert.active {
            display: block;
        }

        @keyframes alertPulse {
            0% {
                transform: translate(-50%, -50%) scale(0.8);
                opacity: 0;
            }
            50% {
                transform: translate(-50%, -50%) scale(1.05);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
                opacity: 1;
            }
        }

        .alert-icon {
            font-size: 36px;
            margin-bottom: 15px;
            animation: iconShake 0.5s;
        }

        @keyframes iconShake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        .alert-text {
            font-weight: 700;
            line-height: 1.6;
        }
    </style>
</head>
<body>
    <div id="boot-screen">
        <div class="grid-bg"></div>

        <div id="camera-indicator">
            <div class="cam-dot"></div>
            <span>CAMERA STANDBY</span>
        </div>

        <div id="status-message">AWAITING HAND GESTURE...</div>

        <div class="content">
            <div class="logo">HEAD UP PROTOCOL</div>
            <div class="subtitle">NEURAL INTERFACE v2.4.7</div>

            <button id="initialize-btn">
                <div class="btn-bg"></div>
                <span class="btn-text">INITIALIZE</span>
                <div class="btn-corners tl"></div>
                <div class="btn-corners tr"></div>
                <div class="btn-corners bl"></div>
                <div class="btn-corners br"></div>
            </button>
        </div>

        <div id="hand-scanner">
            <div class="scanner-frame">
                <div class="scanner-corner tl"></div>
                <div class="scanner-corner tr"></div>
                <div class="scanner-corner bl"></div>
                <div class="scanner-corner br"></div>
                <div class="scan-line"></div>
                <div class="hand-icon">🖐️</div>
                <div class="scan-text">SCANNING BIOMETRICS...</div>
            </div>
        </div>

        <div id="loading-logs"></div>

        <div id="error-alert">
            <div class="alert-icon">⚠</div>
            <div class="alert-text">IDENTITY VERIFICATION FAILED<br>PLEASE TRY AGAIN</div>
        </div>
    </div>

    <video id="video" width="640" height="480" autoplay></video>

    <!-- MediaPipe Hands -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>

    <script>
        // System configuration
        const SYSTEM_CONFIG = {
            scanDuration: 3000, // 3 seconds
            logDelay: 600, // delay between logs
            fadeOutDuration: 1000,
            logs: [
                'ACCESSING OPTICAL SENSORS...',
                'BOOTING NEURAL FRAMEWORK...',
                'LOADING SATELLITE FEED...',
                'INITIALIZING VOICE INTERFACE...',
                'SYSTEM READY'
            ]
        };

        // DOM elements
        const bootScreen = document.getElementById('boot-screen');
        const initializeBtn = document.getElementById('initialize-btn');
        const btnBg = initializeBtn.querySelector('.btn-bg');
        const handScanner = document.getElementById('hand-scanner');
        const loadingLogs = document.getElementById('loading-logs');
        const statusMessage = document.getElementById('status-message');
        const cameraIndicator = document.getElementById('camera-indicator');
        const camDot = cameraIndicator.querySelector('.cam-dot');
        const camText = cameraIndicator.querySelector('span');
        const video = document.getElementById('video');
        const errorAlert = document.getElementById('error-alert');

        let isScanning = false;
        let bootComplete = false;
        let hands, camera;
        let handDetectionTimer = null;
        let scanStartTime = null;
        let logsTimeout = null;

        // Initialize camera and hand detection
        async function initializeCamera() {
            try {
                hands = new Hands({
                    locateFile: (file) => {
                        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
                    }
                });

                hands.setOptions({
                    maxNumHands: 1,
                    modelComplexity: 1,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });

                hands.onResults(onHandsResults);

                camera = new Camera(video, {
                    onFrame: async () => {
                        if (!bootComplete) {
                            await hands.send({ image: video });
                        }
                    },
                    width: 640,
                    height: 480
                });

                await camera.start();

                // Update camera indicator
                camDot.classList.add('active');
                camText.textContent = 'CAMERA ACTIVE';
                statusMessage.classList.add('active');

            } catch (error) {
                console.error('Camera initialization failed:', error);
                camText.textContent = 'CAMERA ERROR';
                // Fallback: allow manual button click
                initializeBtn.classList.remove('disabled');
            }
        }

        // Detect open hand gesture (all 5 fingers extended)
        function onHandsResults(results) {
            if (bootComplete) return;

            const hasHand = results.multiHandLandmarks && results.multiHandLandmarks.length > 0;
            let fingersExtended = 0;

            if (hasHand) {
                const landmarks = results.multiHandLandmarks[0];
                fingersExtended = checkFingersExtended(landmarks);
            }

            // If 5 fingers detected
            if (fingersExtended >= 5) {
                // Start scanning if not already scanning
                if (!isScanning) {
                    startBootSequence();
                }
                // Reset the detection timer (hand is still present)
                if (handDetectionTimer) {
                    clearTimeout(handDetectionTimer);
                }
                handDetectionTimer = setTimeout(() => {
                    // If we get here, hand has been continuously detected for 3 seconds
                    // Do nothing, let the sequence complete
                }, 100);
            } else {
                // Hand gesture lost or not enough fingers
                if (isScanning) {
                    // Check if we've been scanning long enough
                    const elapsed = Date.now() - scanStartTime;
                    if (elapsed < SYSTEM_CONFIG.scanDuration) {
                        // Failed - hand gesture lost before 3 seconds
                        resetBootSequence();
                    }
                }
            }
        }

        // Check which fingers are extended
        function checkFingersExtended(landmarks) {
            let extended = 0;

            // Thumb
            if (landmarks[4].x < landmarks[3].x) extended++;

            // Index finger
            if (landmarks[8].y < landmarks[6].y) extended++;

            // Middle finger
            if (landmarks[12].y < landmarks[10].y) extended++;

            // Ring finger
            if (landmarks[16].y < landmarks[14].y) extended++;

            // Pinky
            if (landmarks[20].y < landmarks[18].y) extended++;

            return extended;
        }

        // Start boot sequence
        function startBootSequence() {
            if (isScanning) return;

            isScanning = true;
            scanStartTime = Date.now();
            statusMessage.classList.remove('active');

            // Show hand scanner animation
            handScanner.classList.add('active');

            // Start button fill animation
            btnBg.classList.add('filling');

            // Show loading logs
            logsTimeout = setTimeout(() => {
                loadingLogs.classList.add('active');
                displayLogsSequentially();
            }, 500);

            // Complete boot sequence after scan duration
            setTimeout(() => {
                if (isScanning) {
                    completeBootSequence();
                }
            }, SYSTEM_CONFIG.scanDuration);
        }

        // Reset boot sequence (hand gesture lost)
        function resetBootSequence() {
            if (!isScanning) return;

            isScanning = false;
            scanStartTime = null;

            // Clear timers
            if (handDetectionTimer) {
                clearTimeout(handDetectionTimer);
                handDetectionTimer = null;
            }
            if (logsTimeout) {
                clearTimeout(logsTimeout);
                logsTimeout = null;
            }

            // Hide scanner
            handScanner.classList.remove('active');

            // Reset button animation
            btnBg.classList.remove('filling');
            // Force reflow to restart animation
            void btnBg.offsetWidth;

            // Clear logs
            loadingLogs.classList.remove('active');
            loadingLogs.innerHTML = '';

            // Show error alert
            errorAlert.classList.add('active');

            // Hide error alert after 2 seconds and restore status message
            setTimeout(() => {
                errorAlert.classList.remove('active');
                statusMessage.classList.add('active');
            }, 2000);
        }

        // Display logs one by one
        function displayLogsSequentially() {
            SYSTEM_CONFIG.logs.forEach((log, index) => {
                setTimeout(() => {
                    const logEntry = document.createElement('div');
                    logEntry.className = 'log-entry';
                    logEntry.innerHTML = log + (index < SYSTEM_CONFIG.logs.length - 1 ? '<span class="dots">...</span>' : '');
                    loadingLogs.appendChild(logEntry);
                }, index * SYSTEM_CONFIG.logDelay);
            });
        }

        // Complete boot sequence
        function completeBootSequence() {
            bootComplete = true;

            // Stop camera
            if (camera) {
                camera.stop();
            }

            // Fade out boot screen
            setTimeout(() => {
                bootScreen.classList.add('fade-out');

                // Call systemBoot after fade out
                setTimeout(() => {
                    systemBoot();
                }, SYSTEM_CONFIG.fadeOutDuration);
            }, 1000);
        }

        // System boot callback - can be overridden by external modules
        function systemBoot() {
            console.log('🚀 HEAD UP PROTOCOL SYSTEM INITIALIZED');
            console.log('📡 Neural interface online');
            console.log('✅ All systems operational');

            // Hide boot screen
            bootScreen.style.display = 'none';

            // External modules can listen to this event
            window.dispatchEvent(new CustomEvent('hudSystemBooted', {
                detail: {
                    timestamp: Date.now(),
                    status: 'operational'
                }
            }));

            // Display main interface (placeholder)
            document.body.innerHTML += `
                <div style="
                    width: 100%;
                    height: 100vh;
                    display: flex;
                    align-items: center;
                    justify-content: center;
                    font-family: 'Orbitron', monospace;
                    color: #00aa33;
                    font-size: 32px;
                    letter-spacing: 4px;
                    text-shadow: 0 0 20px #00aa33;
                ">
                    MAIN INTERFACE LOADED
                </div>
            `;
        }

        // Manual button click (fallback)
        initializeBtn.addEventListener('click', () => {
            if (!initializeBtn.classList.contains('disabled') && !isScanning) {
                startBootSequence();
            }
        });

        // Initialize on page load
        window.addEventListener('load', () => {
            // Disable button initially
            initializeBtn.classList.add('disabled');

            // Initialize camera after a short delay
            setTimeout(() => {
                initializeCamera();
            }, 1000);
        });

        // Export systemBoot function for external use
        window.HUD_Protocol = {
            systemBoot: systemBoot,
            isBooted: () => bootComplete
        };
    </script>
</body>
</html>
